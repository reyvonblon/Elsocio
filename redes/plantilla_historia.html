<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap">
<style>
  :root {
    --ink: #0a0a0a;
    --cream: #f5f0e6;
    --wine: #9c1c2e;
    --wine-light: #b22337;
    --white: #ffffff;
    --muted-dark: #9a9aa2;
    --muted-light: #5c564c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  body.oscuro {
    background-color: var(--ink);
    background-image: radial-gradient(rgba(255,255,255,0.13) 1.6px, transparent 1.6px);
    background-size: 44px 44px;
    color: var(--white);
  }
  body.crema {
    background-color: var(--cream);
    background-image:
      linear-gradient(to right, rgba(10,10,10,0.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(10,10,10,0.055) 1px, transparent 1px);
    background-size: 54px 54px;
    color: var(--ink);
  }
  .story {
    width: 1080px;
    height: 1920px;
    /* Zonas seguras de Instagram Stories: 230px arriba (avatar/barra) y 300px abajo (responder/enviar) */
    padding: 240px 88px 310px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  body.oscuro .badge {
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,255,255,0.16);
  }
  body.crema .badge {
    background: rgba(10,10,10,0.06);
    border: 1.5px solid rgba(10,10,10,0.16);
  }
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--wine);
  }
  .tag-top {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.72;
  }
  .center-card {
    display: flex;
    flex-direction: column;
    gap: 38px;
  }
  .eyebrow {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--wine);
  }
  .gancho {
    font-size: 74px;
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -0.03em;
    display: flex;
    flex-wrap: wrap;
    column-gap: 16px;
    row-gap: 10px;
    align-items: center;
  }
  .gancho .hl {
    background: var(--wine);
    color: var(--white);
    padding: 2px 18px 6px;
    border-radius: 12px;
    display: inline-block;
  }
  .divider {
    width: 110px;
    height: 6px;
    border-radius: 999px;
    background: var(--wine);
  }
  .subtexto {
    font-size: 38px;
    font-weight: 600;
    line-height: 1.34;
    letter-spacing: -0.01em;
    max-width: 860px;
  }
  body.oscuro .subtexto { color: #d5d5dc; }
  body.crema .subtexto { color: #2c2924; }

  .footer {
    display: flex;
    flex-direction: column;
    gap: 36px;
    align-items: flex-start;
  }
  .cta-box {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    padding: 22px 32px;
    border-radius: 18px;
    background: var(--wine);
    color: var(--white);
    font-size: 29px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .brand-row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 12px;
  }
  .mark {
    width: 240px;
    height: auto;
  }
  .brand-caption {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0.65;
  }
</style>
</head>
<body class="oscuro" id="body">
  <div class="story">
    <div class="header">
      <div class="badge">
        <span class="dot"></span>
        <span id="badge">HISTORIA</span>
      </div>
      <div class="tag-top">EL SOCIO</div>
    </div>

    <div class="center-card">
      <div class="eyebrow" id="eyebrow">VERDAD DE NEGOCIO</div>
      <div class="gancho" id="gancho">Tu competencia ya tiene quien le resuelva esto.</div>
      <div class="divider"></div>
      <div class="subtexto" id="subtexto">Tú pones el criterio del negocio. Nosotros ejecutamos lo que te está frenando.</div>
    </div>

    <div class="footer">
      <div class="cta-box" id="cierre">Responde esta historia con tu caso</div>
      <div class="brand-row">
        <svg class="mark" viewBox="0 0 680 344" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="El Socio">
          <defs>
            <linearGradient id="tieRed" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#b22337"/>
              <stop offset="50%" stop-color="#9c1c2e"/>
              <stop offset="100%" stop-color="#721220"/>
            </linearGradient>
          </defs>
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path id="m1" d="M 340 224 C 375 234, 430 240, 470 232 C 495 227, 512 218, 522 206" stroke="currentColor" stroke-width="8"/>
            <path id="m2" d="M 340 224 C 305 234, 250 240, 210 232 C 185 227, 168 218, 158 206" stroke="currentColor" stroke-width="8"/>
          </g>
          <path d="M 224.3 219.5 L 232.7 219.5 L 238 283.5 L 228.5 301.5 L 219 283.5 Z" fill="url(#tieRed)"/>
          <text y="198" font-family="'Playfair Display', Georgia, serif" font-weight="800" font-size="140" fill="currentColor">
            <tspan x="73">El</tspan><tspan x="249">Socio</tspan>
          </text>
          <g stroke="currentColor" fill="none" stroke-linecap="round">
            <circle cx="272" cy="143" r="14.8" stroke-width="2.6"/>
            <circle cx="311" cy="143" r="14.8" stroke-width="2.6"/>
            <path d="M 286.8 142 Q 291.5 136.8, 296.2 142" stroke-width="2.2"/>
          </g>
          <g>
            <path d="M 522 104 C 522 99.5, 543 96.5, 567.5 96.5 C 592 96.5, 613 99.5, 613 104 C 613 108.5, 592 111.5, 567.5 111.5 C 543 111.5, 522 108.5, 522 104 Z" fill="currentColor"/>
            <path d="M 549 49 L 586 49 L 586 100 L 549 100 Z" fill="currentColor"/>
            <rect x="549" y="88" width="37" height="8" fill="#9c1c2e"/>
          </g>
        </svg>
        <div class="brand-caption">SOLUCIONES REALES</div>
      </div>
    </div>
  </div>

<script>
  const STOPWORDS = new Set([
    "el","la","los","las","un","una","de","del","al","a","en","con","sin","por","para",
    "que","qué","como","cómo","tu","tus","su","sus","te","se","lo","ya","no","si","sí",
    "es","son","fue","está","ser","hay","muy","más","pero","o","y","ni","este","esta","esto"
  ]);
  const params = new URLSearchParams(window.location.search);
  const tema = (params.get("tema") || "oscuro").toLowerCase() === "crema" ? "crema" : "oscuro";
  document.getElementById("body").className = tema;

  const badge = (params.get("badge") || "").replace(/[0-9$%]/g, "").trim();
  if (badge) document.getElementById("badge").textContent = badge.slice(0, 18);

  const subtexto = (params.get("subtexto") || "").trim();
  const subEl = document.getElementById("subtexto");
  if (subtexto) {
    subEl.textContent = subtexto;
  } else {
    subEl.style.display = "none";
  }

  const cierre = (params.get("cierre") || "").trim();
  if (cierre) document.getElementById("cierre").textContent = cierre;

  const gancho = (params.get("gancho") || "").trim();
  if (gancho) {
    const cont = document.getElementById("gancho");
    cont.innerHTML = "";
    const palabras = gancho.split(/\s+/).filter(Boolean);
    let mejorIdx = palabras.length - 1;
    let mejorScore = -1;
    palabras.forEach((p, idx) => {
      const limpia = p.toLowerCase().replace(/[.,;:¡!¿?"'()·—–-]/g, "");
      if (!limpia || STOPWORDS.has(limpia)) return;
      const score = limpia.length + (idx >= Math.floor(palabras.length / 2) ? 3 : 0);
      if (score > mejorScore) {
        mejorScore = score;
        mejorIdx = idx;
      }
    });
    palabras.forEach((p, idx) => {
      const span = document.createElement("span");
      if (idx === mejorIdx) span.className = "hl";
      span.textContent = p;
      cont.appendChild(span);
    });
  }
</script>
</body>
</html>
