<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firma de Correo — El Socio</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #f8fafc;
      margin: 0;
      padding: 32px 20px;
    }
    .wrap { max-width: 680px; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin: 0 0 6px; }
    p.sub { color: #94a3b8; font-size: 0.92rem; margin: 0 0 20px; }
    .card {
      background: #ffffff;
      color: #0a0a0a;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.45);
    }
    .actions {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    button {
      background: #9c1c2e;
      color: #ffffff;
      border: 0;
      border-radius: 10px;
      padding: 11px 18px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
    }
    button.sec {
      background: #1c1c1e;
      color: #f8fafc;
      border: 1px solid #333336;
    }
    #msg { color: #d4d4d8; font-size: 0.9rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Firma oficial de correo — El Socio</h1>
    <p class="sub">Haz clic en <strong>Copiar firma para Gmail / Apple Mail</strong> y pégala directamente (Cmd+V) en la configuración de firmas de <code>elsociotuia@gmail.com</code>.</p>

    <div class="card">
      <div id="sig-root">
        <div style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; font-size:13.5px; line-height:1.45; color:#3f3f46; max-width:100%; border-left:2px solid #9c1c2e; padding:2px 0 2px 12px;">
          <div style="font-size:14.5px; font-weight:700; color:#18181b;">Raymond Vonblon &middot; El Socio</div>
          <div style="font-size:12.5px; color:#52525b; margin-top:2px;">Medell&iacute;n, Colombia</div>
          <div style="font-size:12.5px; margin-top:5px;">
            <a href="https://wa.me/573046090036" target="_blank" style="color:#18181b; text-decoration:none; font-weight:600;">WhatsApp +57 304 609 0036</a>
            <span style="color:#a1a1aa;"> &middot; </span>
            <a href="https://reyvonblon.github.io/Elsocio/" target="_blank" style="color:#9c1c2e; text-decoration:none; font-weight:600;">reyvonblon.github.io/Elsocio</a>
          </div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button type="button" onclick="copySignature()">Copiar firma para Gmail / Apple Mail</button>
      <button type="button" class="sec" onclick="copyHtml()">Copiar código HTML</button>
      <span id="msg"></span>
    </div>
  </div>

  <script>
    function copySignature() {
      const el = document.getElementById("sig-root");
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      document.execCommand("copy");
      sel.removeAllRanges();
      document.getElementById("msg").textContent = "✅ Firma copiada. Pégala con Cmd+V en Gmail o Apple Mail.";
    }
    function copyHtml() {
      const html = document.getElementById("sig-root").innerHTML.trim();
      navigator.clipboard.writeText(html).then(() => {
        document.getElementById("msg").textContent = "✅ Código HTML copiado al portapapeles.";
      });
    }
  </script>
</body>
</html>
