<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>El Socio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap">
<style>
  :root{
    --ink:#0a0a0a;
    --white:#ffffff;
    --red:#9c1c2e;
    --red-light:#b22337;
    --muted:#6e6e73;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0;
    background:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;
  }
  .stage{
    width:100%;
    max-width:560px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:36px;
  }
  .mark{ width:min(420px,80vw); height:auto; display:block; }
  .caption{
    font-size:11px;
    font-weight:400;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--muted);
    margin-top:-18px;
    text-align:center;
  }
  form{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  textarea{
    width:100%;
    min-height:140px;
    resize:vertical;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:14px;
    padding:18px;
    font-size:16px;
    line-height:1.5;
    color:var(--white);
    font-family:inherit;
    outline:none;
    transition:border-color .15s ease, background .15s ease;
  }
  textarea::placeholder{
    color:rgba(255,255,255,0.32);
  }
  textarea:focus{
    border-color:rgba(255,255,255,0.4);
    background:rgba(255,255,255,0.06);
  }
  input[type="tel"]{
    width:100%;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:14px;
    padding:16px 18px;
    font-size:16px;
    color:var(--white);
    font-family:inherit;
    outline:none;
    transition:border-color .15s ease, background .15s ease;
  }
  input[type="tel"]::placeholder{
    color:rgba(255,255,255,0.32);
  }
  input[type="tel"]:focus{
    border-color:rgba(255,255,255,0.4);
    background:rgba(255,255,255,0.06);
  }
  button{
    appearance:none;
    border:none;
    cursor:pointer;
    padding:16px 22px;
    border-radius:12px;
    font-size:16px;
    font-weight:700;
    color:var(--white);
    background:linear-gradient(135deg,var(--red-light),var(--red));
    letter-spacing:.01em;
    transition:transform .12s ease, opacity .12s ease;
  }
  button:active{ transform:scale(0.98); }
  button:disabled{ opacity:.45; cursor:not-allowed; }
  .hint{
    font-size:12px;
    color:var(--muted);
    text-align:center;
  }
</style>
</head>

      required

<script>
  const WHATSAPP_NUMBER = "573046090036";
  const WEB3FORMS_ACCESS_KEY = "46d00c8d-fd0c-4d90-9309-dce17eedba23";
  const form = document.getElementById("contact-form");
  const textarea = document.getElementById("message");
  const phoneInput = document.getElementById("phone");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const text = textarea.value.trim();
    const phone = phoneInput.value.trim();
    if (!text || !phone) return;

    fetch("https://api.web3forms.com/submit", {
      method: "POST",
      keepalive: true,
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({
        access_key: WEB3FORMS_ACCESS_KEY,
        subject: "Nuevo mensaje — landing El Socio",
        from_name: "Landing El Socio",
        telefono: phone,
        mensaje: text,
      }),
    }).catch(function () {});

    const url = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(text);
    window.open(url, "_blank", "noopener");
  });
</script>
